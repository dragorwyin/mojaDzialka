  <g><use href="#iso-tomato" transform="translate(748 445) scale(.8)"/><use href="#iso-tomato" transform="translate(1006 426) scale(.8)"/><use href="#iso-tomato" transform="translate(891 385) scale(.8)"/></g>
  <path d="M658 471L878 577L1098 471" fill="none" stroke="#deb17c" stroke-width="5" opacity=".8"/>
  <text x="640" y="632" fill="#687766" font-family="Arial,sans-serif" font-size="14">Bardziej przestrzenny i charakterystyczny, mniej techniczny.</text>
  <text x="60" y="731" fill="#687766" font-family="Arial,sans-serif" font-size="13">Makieta koncepcyjna · fikcyjne przykłady · bez zmian w działającej aplikacji</text>
</svg>
