  <g transform="translate(166 545)"><use href="#lettuce"/><use href="#lettuce" x="76"/><use href="#lettuce" x="152"/><use href="#lettuce" x="228"/><use href="#lettuce" x="304"/></g>
  <text x="84" y="632" fill="#687766" font-family="Arial,sans-serif" font-size="14">Najłatwiej odczytać układ i zachować dokładną siatkę.</text>
  <text x="640" y="224" fill="#315737" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">WARIANT 02</text>
  <text x="640" y="260" fill="#263a2a" font-family="Georgia,serif" font-size="26">Lekka izometria</text>
  <text x="640" y="286" fill="#687766" font-family="Arial,sans-serif" font-size="14">Widoczna wysokość skrzynki · bardziej ilustracyjny ogród</text>
  <ellipse cx="876" cy="598" rx="210" ry="22" fill="#34452e" opacity=".08"/>
  <path d="M658 433L878 328L1098 433L878 539Z" fill="#8c5b35"/>
  <path d="M658 433L878 539V577L658 471Z" fill="#8c5b35"/>
  <path d="M878 539L1098 433V471L878 577Z" fill="#70482f"/>
